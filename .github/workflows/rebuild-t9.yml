name: Rebuild T9 prism

# 手动触发：用项目钉死的 librime 编出 rime_deployer，重新生成九宫格（T9）的
# schema 与 prism，并把结果提交回 main。之后再手动运行一次 Build APK。
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake patch xz-utils

      - name: Fetch pinned inputs
        run: |
          chmod +x scripts/research/fetch-native-engine-inputs.sh
          ./scripts/research/fetch-native-engine-inputs.sh "$RUNNER_TEMP/native-inputs"

      - name: Build deployer and regenerate T9 prism
        env:
          FEELIME_NATIVE_INPUTS: ${{ runner.temp }}/native-inputs
          FEELIME_NATIVE_WORK: ${{ runner.temp }}/t9-work
        run: bash scripts/research/rebuild-t9-prism.sh

      - name: Show result
        run: |
          git status --short
          ls -la app/src/main/assets/engine-data/rime/luna_pinyin_t9.*

      - uses: actions/upload-artifact@v4
        with:
          name: t9-prism
          path: |
            app/src/main/assets/engine-data/rime/luna_pinyin_t9.schema.yaml
            app/src/main/assets/engine-data/rime/luna_pinyin_t9.prism.bin
            app/src/main/assets/engine-data/MANIFEST.json

      - name: Commit regenerated T9 data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/engine-data
          git diff --cached --quiet && { echo "nothing changed"; exit 0; }
          git commit -m "T9: initial-letter abbreviations (regenerated prism)"
          git push
