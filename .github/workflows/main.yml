name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Local gates
        run: |
          node scripts/verify/css_lint.js
          node scripts/verify/mock_bridge_tests.js | tail -5

      - name: Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.1.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Download build assets
        run: ./scripts/setup-assets.sh

      - name: Build thin debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDirectDebug -PfeelimeModels=thin

      - uses: actions/upload-artifact@v4
        with:
          name: feelime-debug-apk
          path: app/build/outputs/apk/direct/debug/*.apk
