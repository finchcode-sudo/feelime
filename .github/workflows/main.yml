name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Local gates
        run: |
          node scripts/verify/css_lint.js
          node scripts/verify/mock_bridge_tests.js | tail -5

      - name: Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.1.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Download build assets
        run: ./scripts/setup-assets.sh

      # ---- 内置离线翻译（中英互译）：Rust 引擎 + 模型 ----
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Build translation engine (libfeelime_translate.so)
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.0.13004108"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.0.13004108"
          test -d "$ANDROID_NDK_HOME" || { echo "NDK 28.0.13004108 missing"; ls "$ANDROID_HOME/ndk"; exit 1; }
          # runner 预置的 ANDROID_NDK_ROOT 指向别的版本（如 27.x）：全部对齐到同一个，
          # 否则 cmake 与 cargo 会各用各的工具链。
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"
          export ANDROID_NDK="$ANDROID_NDK_HOME"
          export NDK_HOME="$ANDROID_NDK_HOME"
          cargo install cargo-ndk --locked
          # slimt-sys 的 build.rs 经 cmake 交叉编译 C++，按它文档约定设环境变量。
          export CMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake"
          export ANDROID_ABI=arm64-v8a
          export ANDROID_PLATFORM=android-23
          export CMAKE_GENERATOR=Ninja
          # CMake 4.x 不再接受 vendored 第三方（sentencepiece 等）里写的旧版本声明，放行到 3.5。
          export CMAKE_POLICY_VERSION_MINIMUM=3.5
          cd native/feelime-translate
          cargo ndk -t arm64-v8a --platform 23 -o ../../app/src/main/jniLibs build --release
          ls -la ../../app/src/main/jniLibs/arm64-v8a/libfeelime_translate.so

      - name: Download translation models
        run: |
          mkdir -p app/src/main/assets/translate-models "$RUNNER_TEMP/tm"
          curl -fL --retry 3 -o "$RUNNER_TEMP/models-zh-en.zip" \
            "https://github.com/${{ github.repository }}/releases/download/translate-models-v1/models-zh-en.zip"
          unzip -o "$RUNNER_TEMP/models-zh-en.zip" -d "$RUNNER_TEMP/tm"
          cp "$RUNNER_TEMP"/tm/bin/* app/src/main/assets/translate-models/
          ls -la app/src/main/assets/translate-models

      - name: Build full debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDirectDebug

      - uses: actions/upload-artifact@v4
        with:
          name: feelime-debug-apk
          path: app/build/outputs/apk/direct/debug/*.apk
